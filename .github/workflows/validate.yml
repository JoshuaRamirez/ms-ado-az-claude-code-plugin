name: Validate Plugin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate plugin.json structure
        run: |
          echo "Validating plugin.json structure..."

          PLUGIN_FILE=".claude-plugin/plugin.json"

          if [ ! -f "$PLUGIN_FILE" ]; then
            echo "ERROR: $PLUGIN_FILE not found"
            exit 1
          fi

          # Validate JSON syntax
          if ! node -e "JSON.parse(require('fs').readFileSync('$PLUGIN_FILE', 'utf8'))"; then
            echo "ERROR: $PLUGIN_FILE contains invalid JSON"
            exit 1
          fi

          # Check required fields
          node -e "
            const plugin = JSON.parse(require('fs').readFileSync('$PLUGIN_FILE', 'utf8'));
            const required = ['name', 'version', 'description'];
            const missing = required.filter(f => !plugin[f]);
            if (missing.length > 0) {
              console.error('ERROR: Missing required fields in plugin.json:', missing.join(', '));
              process.exit(1);
            }
            console.log('plugin.json validation passed');
            console.log('  name:', plugin.name);
            console.log('  version:', plugin.version);
            console.log('  description:', plugin.description);
          "

      - name: Validate marketplace.json
        run: |
          echo "Validating marketplace.json..."

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const MARKETPLACE_FILE = '.claude-plugin/marketplace.json';
          const PLUGIN_FILE = '.claude-plugin/plugin.json';
          const repoRoot = process.cwd();
          let repoReal;
          try {
            repoReal = fs.realpathSync(repoRoot);
          } catch (err) {
            console.error('ERROR: could not resolve repository root:', repoRoot);
            process.exit(1);
          }
          let failed = false;

          function fail(msg) {
            console.error('ERROR:', msg);
            failed = true;
          }

          function ok(msg) {
            console.log('OK:', msg);
          }

          if (!fs.existsSync(MARKETPLACE_FILE)) {
            console.error('ERROR:', MARKETPLACE_FILE, 'not found (required for marketplace install)');
            process.exit(1);
          }
          ok(MARKETPLACE_FILE + ' exists');

          let marketplace;
          try {
            marketplace = JSON.parse(fs.readFileSync(MARKETPLACE_FILE, 'utf8'));
          } catch (err) {
            console.error('ERROR:', MARKETPLACE_FILE, 'contains invalid JSON');
            console.error(err.message);
            process.exit(1);
          }
          ok('valid JSON');

          if (typeof marketplace.name !== 'string' || !marketplace.name.trim()) {
            fail('missing required top-level field: name');
          } else {
            ok('top-level name: ' + marketplace.name);
          }

          if (!marketplace.owner || typeof marketplace.owner !== 'object' || Array.isArray(marketplace.owner)) {
            fail('missing required top-level field: owner (must be an object)');
          } else if (typeof marketplace.owner.name !== 'string' || !marketplace.owner.name.trim()) {
            fail('owner.name is required');
          } else {
            ok('owner.name: ' + marketplace.owner.name);
          }

          if (!Array.isArray(marketplace.plugins)) {
            fail('missing required top-level field: plugins (must be an array)');
          } else if (marketplace.plugins.length === 0) {
            fail('plugins array is empty');
          } else {
            ok('plugins: ' + marketplace.plugins.length + ' entry/entries');
          }

          let pluginJson = null;
          try {
            pluginJson = JSON.parse(fs.readFileSync(PLUGIN_FILE, 'utf8'));
            ok('loaded ' + PLUGIN_FILE + ' for identity comparison');
          } catch (err) {
            fail('could not read ' + PLUGIN_FILE + ' for identity comparison');
          }

          if (Array.isArray(marketplace.plugins)) {
            marketplace.plugins.forEach((entry, index) => {
              const label = 'plugins[' + index + ']';
              if (!entry || typeof entry !== 'object' || Array.isArray(entry)) {
                fail(label + ' must be an object');
                return;
              }

              if (typeof entry.name !== 'string' || !entry.name.trim()) {
                fail(label + ' missing required field: name');
              } else {
                ok(label + ' name: ' + entry.name);
              }

              const entryVersion = typeof entry.version === 'string' ? entry.version.trim() : '';
              if (!entryVersion) {
                fail(label + ' missing required field: version');
              } else {
                ok(label + ' version: ' + entryVersion);
              }

              if (entry.source == null || entry.source === '') {
                fail(label + ' missing required field: source');
                return;
              }

              let sourceDir = null;
              if (typeof entry.source === 'string') {
                if (!entry.source.startsWith('./')) {
                  fail(label + ' source path must start with ./ (got ' + JSON.stringify(entry.source) + ')');
                  return;
                }
                const resolved = path.resolve(repoRoot, entry.source);
                if (!fs.existsSync(resolved)) {
                  fail(label + ' source path does not resolve to a directory: ' + entry.source);
                  return;
                }
                let sourceReal;
                try {
                  sourceReal = fs.realpathSync(resolved);
                } catch (err) {
                  fail(label + ' source path does not resolve to a directory: ' + entry.source);
                  return;
                }
                let sourceIsDir = false;
                try {
                  sourceIsDir = fs.statSync(sourceReal).isDirectory();
                } catch (err) {
                  fail(label + ' source path does not resolve to a directory: ' + entry.source);
                  return;
                }
                if (!sourceIsDir) {
                  fail(label + ' source path does not resolve to a directory: ' + entry.source);
                  return;
                }
                const relativeReal = path.relative(repoReal, sourceReal);
                if (relativeReal.startsWith('..') || path.isAbsolute(relativeReal)) {
                  fail(label + ' source real path escapes the repository: ' + entry.source + ' -> ' + sourceReal);
                  return;
                }
                ok(label + ' source resolves: ' + entry.source + ' -> ' + (relativeReal || '.'));
                sourceDir = sourceReal;
              } else if (typeof entry.source === 'object') {
                if (typeof entry.source.source !== 'string' || !entry.source.source.trim()) {
                  fail(label + ' object source must include a source type');
                } else {
                  ok(label + ' remote source type: ' + entry.source.source);
                }
              } else {
                fail(label + ' source must be a relative path string or a source object');
              }

              if (sourceDir) {
                const nestedPlugin = path.join(sourceDir, '.claude-plugin', 'plugin.json');
                if (!fs.existsSync(nestedPlugin)) {
                  fail(label + ' source directory has no .claude-plugin/plugin.json');
                } else {
                  try {
                    const sourced = JSON.parse(fs.readFileSync(nestedPlugin, 'utf8'));
                    if (entry.name && entry.name !== sourced.name) {
                      fail(label + ' name "' + entry.name + '" does not match ' + path.relative(repoRoot, nestedPlugin) + ' name "' + sourced.name + '"');
                    } else if (entry.name) {
                      ok(label + ' name matches plugin.json: ' + sourced.name);
                    }
                    const sourcedVersion = typeof sourced.version === 'string' ? sourced.version.trim() : '';
                    if (!sourcedVersion) {
                      fail(label + ' source plugin.json is missing required field: version');
                    } else if (entryVersion && entryVersion !== sourcedVersion) {
                      fail(label + ' version "' + entryVersion + '" does not match plugin.json version "' + sourcedVersion + '"');
                    } else if (entryVersion) {
                      ok(label + ' version matches plugin.json: ' + sourcedVersion);
                    }
                  } catch (err) {
                    fail(label + ' source plugin.json is not valid JSON');
                  }
                }
              }

              if (pluginJson && entry.name && entry.name !== pluginJson.name) {
                fail(label + ' name "' + entry.name + '" does not match repo plugin.json name "' + pluginJson.name + '"');
              }
            });
          }

          if (failed) {
            console.error('');
            console.error('FAILED: marketplace.json validation errors');
            process.exit(1);
          }

          console.log('');
          console.log('marketplace.json validation passed');
          EOF

      - name: Validate command files have required frontmatter
        run: |
          echo "Validating command files..."

          ERRORS=0

          # Find all .md files in commands directory
          while IFS= read -r -d '' file; do
            echo "Checking: $file"

            # Check if file starts with frontmatter delimiter
            if ! head -1 "$file" | grep -q "^---$"; then
              echo "  ERROR: Missing frontmatter (must start with ---)"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Extract frontmatter (content between first and second ---)
            FRONTMATTER=$(awk '/^---$/{p=!p; if(p) next; else exit} p' "$file")

            if [ -z "$FRONTMATTER" ]; then
              echo "  ERROR: Empty or malformed frontmatter"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check for required 'description' field
            if ! echo "$FRONTMATTER" | grep -q "^description:"; then
              echo "  ERROR: Missing required 'description' field in frontmatter"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check for required 'allowed-tools' field
            if ! echo "$FRONTMATTER" | grep -q "^allowed-tools:"; then
              echo "  ERROR: Missing required 'allowed-tools' field in frontmatter"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            echo "  OK"

          done < <(find commands -name "*.md" -type f -print0 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "FAILED: $ERRORS command file(s) have validation errors"
            exit 1
          fi

          echo ""
          echo "All command files validated successfully"

      - name: Reject unsupported --top on az boards query
        run: |
          echo "Checking command files for az boards query --top..."

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          function walk(dir, acc) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full, acc);
              } else if (entry.isFile() && entry.name.endsWith('.md')) {
                acc.push(full);
              }
            }
            return acc;
          }

          const files = fs.existsSync('commands') ? walk('commands', []) : [];
          let failed = false;

          for (const file of files) {
            const folded = fs.readFileSync(file, 'utf8').replace(/\\\r?\n/g, ' ');
            folded.split(/\r?\n/).forEach((line, idx) => {
              if (!/\baz\s+boards\s+query\b/.test(line)) {
                return;
              }
              // Flag form only: --top / --top=N. Do not match --query or Search API "$top".
              if (/(^|[\s])--top(\s|=|$)/.test(line)) {
                console.error('ERROR: ' + file + ':' + (idx + 1) + ' passes --top to az boards query');
                console.error('  ' + line.trim());
                failed = true;
              }
            });
          }

          if (failed) {
            console.error('');
            console.error('FAILED: az boards query does not support --top; use --query "[:N]" or pipe to head');
            process.exit(1);
          }

          console.log('OK: no commands/**/*.md pass --top to az boards query');
          EOF

      - name: Reject unsupported wit --resource comments on az devops invoke
        run: |
          echo "Checking command and agent files for az devops invoke --area wit --resource comments..."

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          function walk(dir, acc) {
            if (!fs.existsSync(dir)) {
              return acc;
            }
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full, acc);
              } else if (entry.isFile() && entry.name.endsWith('.md')) {
                acc.push(full);
              }
            }
            return acc;
          }

          const files = walk('commands', []).concat(walk('agents', []));
          let failed = false;

          for (const file of files) {
            const folded = fs.readFileSync(file, 'utf8').replace(/\\\r?\n/g, ' ');
            folded.split(/\r?\n/).forEach((line, idx) => {
              if (!/\baz\s+devops\s+invoke\b/.test(line)) {
                return;
              }
              const hasAreaWit = /(^|[\s])--area(\s+|=)wit\b/.test(line);
              // Flag form only: --resource comments / --resource=comments.
              // Do not match prose "comments", /ado:items:comments, or --discussion.
              const hasResourceComments = /(^|[\s])--resource(\s+|=)comments\b/.test(line);
              if (hasAreaWit && hasResourceComments) {
                console.error('ERROR: ' + file + ':' + (idx + 1) + ' teaches az devops invoke --area wit --resource comments');
                console.error('  ' + line.trim());
                failed = true;
              }
            });
          }

          if (failed) {
            console.error('');
            console.error('FAILED: az devops invoke --area wit --resource comments returns 404; use --discussion on az boards work-item update and revisions/System.History');
            process.exit(1);
          }

          console.log('OK: no commands/**/*.md or agents/**/*.md teach az devops invoke --area wit --resource comments');
          EOF

      - name: Reject System.LinkTypes reference names on relation add/remove
        run: |
          echo "Checking command and agent files for az boards work-item relation add/remove --relation-type System.LinkTypes.*..."

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          function walk(dir, acc) {
            if (!fs.existsSync(dir)) {
              return acc;
            }
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full, acc);
              } else if (entry.isFile() && entry.name.endsWith('.md')) {
                acc.push(full);
              }
            }
            return acc;
          }

          const files = walk('commands', []).concat(walk('agents', []));
          let failed = false;

          for (const file of files) {
            const folded = fs.readFileSync(file, 'utf8').replace(/\\\r?\n/g, ' ');
            folded.split(/\r?\n/).forEach((line, idx) => {
              if (!/\baz\s+boards\s+work-item\s+relation\s+(add|remove)\b/.test(line)) {
                return;
              }
              // Flag form only: --relation-type System.LinkTypes... / --relation-type=System.LinkTypes...
              // Quoted or unquoted. Do not match prose that merely mentions System.LinkTypes.
              if (/(^|[\s])--relation-type(\s+|=)["']?System\.LinkTypes\./.test(line)) {
                console.error('ERROR: ' + file + ':' + (idx + 1) + ' teaches az boards work-item relation add/remove with --relation-type System.LinkTypes.*');
                console.error('  ' + line.trim());
                failed = true;
              }
            });
          }

          if (failed) {
            console.error('');
            console.error('FAILED: --relation-type must use friendly names (Parent, Child, Related), not System.LinkTypes.* reference names');
            process.exit(1);
          }

          console.log('OK: no commands/**/*.md or agents/**/*.md teach relation add/remove with --relation-type System.LinkTypes.*');
          EOF

      - name: Reject unverified work --resource boardcolumns on az devops invoke
        run: |
          echo "Checking command and agent files for az devops invoke --area work --resource boardcolumns..."

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          function walk(dir, acc) {
            if (!fs.existsSync(dir)) {
              return acc;
            }
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full, acc);
              } else if (entry.isFile() && entry.name.endsWith('.md')) {
                acc.push(full);
              }
            }
            return acc;
          }

          const files = walk('commands', []).concat(walk('agents', []));
          let failed = false;

          for (const file of files) {
            const folded = fs.readFileSync(file, 'utf8').replace(/\\\r?\n/g, ' ');
            folded.split(/\r?\n/).forEach((line, idx) => {
              if (!/\baz\s+devops\s+invoke\b/.test(line)) {
                return;
              }
              const hasAreaWork = /(^|[\s])--area(\s+|=)["']?work\b/.test(line);
              // Flag form only: --resource boardcolumns / --resource=boardcolumns.
              // Quoted or unquoted. Do not match prose "board columns",
              // /ado:boards:columns, or the verified --resource columns.
              const hasResourceBoardcolumns = /(^|[\s])--resource(\s+|=)["']?boardcolumns\b/.test(line);
              if (hasAreaWork && hasResourceBoardcolumns) {
                console.error('ERROR: ' + file + ':' + (idx + 1) + ' teaches az devops invoke --area work --resource boardcolumns');
                console.error('  ' + line.trim());
                failed = true;
              }
            });
          }

          if (failed) {
            console.error('');
            console.error('FAILED: az devops invoke --area work --resource boardcolumns is unverified and can KeyError; use --resource columns');
            process.exit(1);
          }

          console.log('OK: no commands/**/*.md or agents/**/*.md teach az devops invoke --area work --resource boardcolumns');
          EOF

      - name: Reject unverified search --resource casing on az devops invoke
        run: |
          echo "Checking command and agent files for az devops invoke --area search with non-lowercase --resource workitemsearchresults..."

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          function walk(dir, acc) {
            if (!fs.existsSync(dir)) {
              return acc;
            }
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full, acc);
              } else if (entry.isFile() && entry.name.endsWith('.md')) {
                acc.push(full);
              }
            }
            return acc;
          }

          const files = walk('commands', []).concat(walk('agents', []));
          let failed = false;

          for (const file of files) {
            const folded = fs.readFileSync(file, 'utf8').replace(/\\\r?\n/g, ' ');
            folded.split(/\r?\n/).forEach((line, idx) => {
              if (!/\baz\s+devops\s+invoke\b/.test(line)) {
                return;
              }
              const hasAreaSearch = /(^|[\s])--area(\s+|=)["']?search\b/.test(line);
              // Flag form only: --resource … / --resource=….
              // Quoted or unquoted. Reject any casing of workitemsearchresults
              // other than the exact lowercase verified resource.
              // Do not match prose that merely mentions work item search results.
              const resourceMatch = line.match(/(^|[\s])--resource(\s+|=)["']?([A-Za-z0-9]+)/);
              const resource = resourceMatch && resourceMatch[3];
              const hasWrongCasing = resource &&
                resource.toLowerCase() === 'workitemsearchresults' &&
                resource !== 'workitemsearchresults';
              if (hasAreaSearch && hasWrongCasing) {
                console.error('ERROR: ' + file + ':' + (idx + 1) + ' teaches az devops invoke --area search --resource ' + resource + ' (use workitemsearchresults)');
                console.error('  ' + line.trim());
                failed = true;
              }
            });
          }

          if (failed) {
            console.error('');
            console.error('FAILED: az devops invoke --area search must use --resource workitemsearchresults (all lowercase); other casings can KeyError');
            process.exit(1);
          }

          console.log('OK: no commands/**/*.md or agents/**/*.md teach az devops invoke --area search with a non-lowercase --resource workitemsearchresults');
          EOF

      - name: Reject unverified work --resource backlogconfiguration on az devops invoke
        run: |
          echo "Checking command and agent files for az devops invoke --area work --resource backlogconfiguration..."

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          function walk(dir, acc) {
            if (!fs.existsSync(dir)) {
              return acc;
            }
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full, acc);
              } else if (entry.isFile() && entry.name.endsWith('.md')) {
                acc.push(full);
              }
            }
            return acc;
          }

          const files = walk('commands', []).concat(walk('agents', []));
          let failed = false;

          for (const file of files) {
            const folded = fs.readFileSync(file, 'utf8').replace(/\\\r?\n/g, ' ');
            folded.split(/\r?\n/).forEach((line, idx) => {
              if (!/\baz\s+devops\s+invoke\b/.test(line)) {
                return;
              }
              const hasAreaWork = /(^|[\s])--area(\s+|=)["']?work\b/.test(line);
              // Flag form only: --resource backlogconfiguration / --resource=backlogconfiguration
              // (or nearby casing such as backlogconfigurations). Quoted or unquoted.
              // Do not match prose "backlog configuration" or the verified --resource backlogs.
              const hasResourceBacklogconfiguration = /(^|[\s])--resource(\s+|=)["']?backlogconfigurations?\b/i.test(line);
              if (hasAreaWork && hasResourceBacklogconfiguration) {
                console.error('ERROR: ' + file + ':' + (idx + 1) + ' teaches az devops invoke --area work --resource backlogconfiguration');
                console.error('  ' + line.trim());
                failed = true;
              }
            });
          }

          if (failed) {
            console.error('');
            console.error('FAILED: az devops invoke --area work --resource backlogconfiguration is unverified and can KeyError; use --resource backlogs');
            process.exit(1);
          }

          console.log('OK: no commands/**/*.md or agents/**/*.md teach az devops invoke --area work --resource backlogconfiguration');
          EOF

      - name: Reject unverified work --resource cardrulesettings PATCH on az devops invoke
        run: |
          echo "Checking command and agent files for az devops invoke --area work --resource cardrulesettings --http-method PATCH..."

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          function walk(dir, acc) {
            if (!fs.existsSync(dir)) {
              return acc;
            }
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full, acc);
              } else if (entry.isFile() && entry.name.endsWith('.md')) {
                acc.push(full);
              }
            }
            return acc;
          }

          const files = walk('commands', []).concat(walk('agents', []));
          let failed = false;

          for (const file of files) {
            const folded = fs.readFileSync(file, 'utf8').replace(/\\\r?\n/g, ' ');
            folded.split(/\r?\n/).forEach((line, idx) => {
              if (!/\baz\s+devops\s+invoke\b/.test(line)) {
                return;
              }
              const hasAreaWork = /(^|[\s])--area(\s+|=)["']?work\b/.test(line);
              // Flag form only: --resource cardrulesettings / --resource=cardrulesettings
              // (or nearby casing such as CardRuleSettings). Quoted or unquoted.
              // Do not match prose "card rule settings" or GET-only invoke examples.
              const hasResourceCardrulesettings = /(^|[\s])--resource(\s+|=)["']?cardrulesettings\b/i.test(line);
              // Flag form only: --http-method PATCH / --http-method=PATCH
              // (or nearby casing such as patch). Quoted or unquoted.
              const hasHttpMethodPatch = /(^|[\s])--http-method(\s+|=)["']?patch\b/i.test(line);
              if (hasAreaWork && hasResourceCardrulesettings && hasHttpMethodPatch) {
                console.error('ERROR: ' + file + ':' + (idx + 1) + ' teaches az devops invoke --area work --resource cardrulesettings --http-method PATCH');
                console.error('  ' + line.trim());
                failed = true;
              }
            });
          }

          if (failed) {
            console.error('');
            console.error('FAILED: PATCH on --resource cardrulesettings is unverified and can KeyError; this command is GET/view only');
            process.exit(1);
          }

          console.log('OK: no commands/**/*.md or agents/**/*.md teach az devops invoke --area work --resource cardrulesettings --http-method PATCH');
          EOF

      - name: Validate skill files have required frontmatter
        run: |
          echo "Validating skill files..."

          ERRORS=0

          # Find all SKILL.md files in skills directory
          while IFS= read -r -d '' file; do
            echo "Checking: $file"

            # Check if file starts with frontmatter delimiter
            if ! head -1 "$file" | grep -q "^---$"; then
              echo "  ERROR: Missing frontmatter (must start with ---)"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Extract frontmatter
            FRONTMATTER=$(awk '/^---$/{p=!p; if(p) next; else exit} p' "$file")

            if [ -z "$FRONTMATTER" ]; then
              echo "  ERROR: Empty or malformed frontmatter"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check for required 'name' field
            if ! echo "$FRONTMATTER" | grep -q "^name:"; then
              echo "  ERROR: Missing required 'name' field in frontmatter"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check for required 'description' field
            if ! echo "$FRONTMATTER" | grep -q "^description:"; then
              echo "  ERROR: Missing required 'description' field in frontmatter"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            echo "  OK"

          done < <(find skills -name "SKILL.md" -type f -print0 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "FAILED: $ERRORS skill file(s) have validation errors"
            exit 1
          fi

          echo ""
          echo "All skill files validated successfully"

      - name: Validate agent files have required frontmatter
        run: |
          echo "Validating agent files..."

          ERRORS=0

          # Find all .md files in agents directory
          while IFS= read -r -d '' file; do
            echo "Checking: $file"

            # Check if file starts with frontmatter delimiter
            if ! head -1 "$file" | grep -q "^---$"; then
              echo "  ERROR: Missing frontmatter (must start with ---)"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Extract frontmatter
            FRONTMATTER=$(awk '/^---$/{p=!p; if(p) next; else exit} p' "$file")

            if [ -z "$FRONTMATTER" ]; then
              echo "  ERROR: Empty or malformed frontmatter"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check for required 'name' field
            if ! echo "$FRONTMATTER" | grep -q "^name:"; then
              echo "  ERROR: Missing required 'name' field in frontmatter"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check for required 'description' field
            if ! echo "$FRONTMATTER" | grep -q "^description:"; then
              echo "  ERROR: Missing required 'description' field in frontmatter"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            echo "  OK"

          done < <(find agents -name "*.md" -type f -print0 2>/dev/null)

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "FAILED: $ERRORS agent file(s) have validation errors"
            exit 1
          fi

          echo ""
          echo "All agent files validated successfully"

      - name: Summary
        run: |
          echo ""
          echo "=========================================="
          echo "Plugin Validation Summary"
          echo "=========================================="
          echo ""
          echo "Commands:"
          find commands -name "*.md" -type f 2>/dev/null | wc -l | xargs echo "  Total command files:"
          echo ""
          echo "Skills:"
          find skills -name "SKILL.md" -type f 2>/dev/null | wc -l | xargs echo "  Total skill files:"
          echo ""
          echo "Agents:"
          find agents -name "*.md" -type f 2>/dev/null | wc -l | xargs echo "  Total agent files:"
          echo ""
          echo "All validations passed!"
